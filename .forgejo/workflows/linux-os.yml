name: linux-os-test
on: 
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs: 
  linux-test:
    runs-on: ubuntu-latest
    container:
      image: registry:5000/ubuntu:rust-24.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Rust version
        run: |
          whoami
          export PATH="$HOME/.cargo/bin:$PATH"
          rustc --version

      - name: Run build debug
        run: |
          cargo build --tests --examples
          cargo check --tests --examples
          cargo test --tests --examples